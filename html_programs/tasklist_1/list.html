<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List(Unordered, Ordered lists)</title>
</head>
<body>
    <h3>unordered list</h3>
    <ul>
        <li>wake up</li>
        <li>eat</li>
        <li>work</li>
        <li>have some physical activity</li>
    </ul>
    <h3>ordered list</h3>
    <ol>
        <li>stephen curry</li>
        <li>lebron james</li>
        <li>rose</li>
    </ol>
</body>
</html>
