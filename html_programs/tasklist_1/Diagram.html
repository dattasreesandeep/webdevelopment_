<html>
<head>
    <title>Nested Squares</title>
</head>
<body>

    <div class="square1">
        <div class="square2">
            <div class="square3">
                <div class="square4"></div>
            </div>
        </div>
    </div>

</body>
<style>
        body{
            display: flex;
            justify-content: center;   /* Horizontal center */
            align-items: center;       /* Vertical center */

        }
    .square1{
        width: 500px;
        height: 500px;
        border: solid black 1px;
    }

    .square2{
        margin : 68px;
        width: 350px;
        height: 350px;
        border: solid black 1px;
    }


    .square3{
        margin : 45px;
        width: 250px;
        height: 250px;
        border: solid black 1px;
    }


    .square4{
        margin : 48px;
        width: 150px;
        height: 150px;
        border: solid black 1px;
    }
</style>
</html>
