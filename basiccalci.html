<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator Operations</title>

    <style>

        body{
            font-family: Arial;
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
        }

        input, select, button{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 18px;
        }

        #result{
            margin-top: 20px;
            font-size: 22px;
            text-align: center;
            color: blue;
        }

    </style>
</head>

<body>

    <div class="box">

        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="Enter Number 1">

        <input type="number" id="num2" placeholder="Enter Number 2">

        <select id="operation">

            <option value="add">Addition</option>

            <option value="sub">Subtraction</option>

            <option value="mul">Multiplication</option>

            <option value="div">Division</option>

            <option value="mod">Modulus</option>

        </select>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>

    </div>

    <script>

        function addition(a,b){
            return a + b;
        }

        function subtraction(a,b){
            return a - b;
        }

        function multiplication(a,b){
            return a * b;
        }

        function division(a,b){
            return a / b;
        }

        function modulus(a,b){
            return a % b;
        }

        function calculate(){

            let n1 = Number(document.getElementById("num1").value);

            let n2 = Number(document.getElementById("num2").value);

            let op = document.getElementById("operation").value;

            let answer;

            if(op == "add"){
                answer = addition(n1,n2);
            }

            else if(op == "sub"){
                answer = subtraction(n1,n2);
            }

            else if(op == "mul"){
                answer = multiplication(n1,n2);
            }

            else if(op == "div"){
                answer = division(n1,n2);
            }

            else if(op == "mod"){
                answer = modulus(n1,n2);
            }

            document.getElementById("result").innerHTML = "Result : " + answer;

        }

    </script>

</body>
</html>
