<!-- Javascript Program to Generate a Random Number -->

<!-- 

Math.random() - Generates a decimal between 0 and 1.
Math.random() * 100 - Generates a decimal between 0 and 100
Math.floor(Math.random() * 100) - Removes the decimal part, giving 0 to 99
Math.floor(Math.random() * 100) + 1 - Math.floor(Math.random() * 100) + 1

-->





<html>
<head>
    <title>Random Number</title>
</head>
<body>

    <button onclick="generate()">Generate Random Number</button>

    <p id="result"></p>

    <script>
        function generate() {
            var num = Math.random() * 100;

            document.getElementById("result").innerHTML =
                "Random Number = " + num;
        }
    </script>

</body>
</html>
