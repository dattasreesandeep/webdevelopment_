<!-- JavaScript Program to Find the Largest Among Three Numbers   -->


<html>
<head>
    <title>Largest Among Three Numbers</title>
</head>
<body>

    <input type="text" id="num1" placeholder="Enter 1st Number"><br><br>
    <input type="text" id="num2" placeholder="Enter 2nd Number"><br><br>
    <input type="text" id="num3" placeholder="Enter 3rd Number"><br><br>

    <button onclick="largest()">Find Largest</button>

    <p id="result"></p>

    <script>
        function largest() {
            var a = Number(document.getElementById("num1").value);
            var b = Number(document.getElementById("num2").value);
            var c = Number(document.getElementById("num3").value);

            if (a >= b && a >= c) {
                document.getElementById("result").innerHTML =
                    "Largest Number = " + a;
            }
            else if (b >= a && b >= c) {
                document.getElementById("result").innerHTML =
                    "Largest Number = " + b;
            }
            else {
                document.getElementById("result").innerHTML =
                    "Largest Number = " + c;
            }
        }
    </script>

</body>
</html>
